<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
		<link rel="manifest" href="/favicons/site.webmanifest" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Scanopy</title>
		<script>
			(function () {
				var q = new URLSearchParams(location.search);
				var p = q.get('theme');
				// n9e 嵌入且未指定 theme 时初始默认浅色(避免加载瞬间闪黑)
				var embed = q.get('embed') === '1' || localStorage.getItem('scanopy-embed') === '1';
				var t =
					p === 'light' || p === 'dark'
						? p
						: embed
							? 'light'
							: localStorage.getItem('scanopy-theme') || 'system';
				var d =
					t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', d);
				document.documentElement.style.colorScheme = d ? 'dark' : 'light';
			})();
		</script>
		<script>
			// n9e 嵌入:API 路径前缀。iframe 首次带 ?apiBase=/topo-studio/scanopy-api;
			// 存 localStorage 以在 SPA 内整页刷新(query 丢失)后仍生效。原生部署无参数 → 空。
			(function () {
				var a = new URLSearchParams(location.search).get('apiBase');
				if (a !== null) localStorage.setItem('scanopy-api-base', a);
				window.__SCANOPY_API_BASE__ = a !== null ? a : localStorage.getItem('scanopy-api-base') || '';
			})();
			// n9e 嵌入模式:隐藏 scanopy 自带壳(billing/banner/Upgrade/品牌等)。
			// iframe 带 ?embed=1;存 localStorage 抗整页刷新。原生部署无参数 → false。
			(function () {
				var e = new URLSearchParams(location.search).get('embed');
				if (e !== null) localStorage.setItem('scanopy-embed', e);
				window.__SCANOPY_EMBED__ = (e !== null ? e : localStorage.getItem('scanopy-embed') || '') === '1';
				// 加 class 供 n9e-bridge.css 门控主题桥接(仅嵌入时对齐 n9e 色板/字体)
				if (window.__SCANOPY_EMBED__) document.documentElement.classList.add('n9e-embed');
			})();
			// n9e 语言联动:iframe 带 ?locale=zh|en(由 n9e 当前语言映射)。
			// Paraglide strategy 首选 PARAGLIDE_LOCALE cookie,这里按 URL 种 cookie 决定初始语言。
			(function () {
				var l = new URLSearchParams(location.search).get('locale');
				if (l === 'zh' || l === 'en') {
					document.cookie = 'PARAGLIDE_LOCALE=' + l + ';path=/;max-age=34560000;samesite=lax';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
