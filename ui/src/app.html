<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
		<link rel="manifest" href="/favicons/site.webmanifest" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Scanopy</title>
		<script>
			(function () {
				var p = new URLSearchParams(location.search).get('theme');
				var t =
					p === 'light' || p === 'dark' ? p : localStorage.getItem('scanopy-theme') || 'system';
				var d =
					t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', d);
				document.documentElement.style.colorScheme = d ? 'dark' : 'light';
			})();
		</script>
		<script>
			// n9e 嵌入:API 路径前缀。iframe 首次带 ?apiBase=/topo-studio/scanopy-api;
			// 存 localStorage 以在 SPA 内整页刷新(query 丢失)后仍生效。原生部署无参数 → 空。
			(function () {
				var a = new URLSearchParams(location.search).get('apiBase');
				if (a !== null) localStorage.setItem('scanopy-api-base', a);
				window.__SCANOPY_API_BASE__ = a !== null ? a : localStorage.getItem('scanopy-api-base') || '';
			})();
			// n9e 嵌入模式:隐藏 scanopy 自带壳(billing/banner/Upgrade/品牌等)。
			// iframe 带 ?embed=1;存 localStorage 抗整页刷新。原生部署无参数 → false。
			(function () {
				var e = new URLSearchParams(location.search).get('embed');
				if (e !== null) localStorage.setItem('scanopy-embed', e);
				window.__SCANOPY_EMBED__ = (e !== null ? e : localStorage.getItem('scanopy-embed') || '') === '1';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
