[package]
name = "scanopy-server"
version = "0.17.14"
edition = "2024"
description = "Scanopy HTTP API server"

[[bin]]
name = "daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "generate-error-codes"
path = "src/bin/generate-error-codes.rs"

[[bin]]
name = "generate-fixtures"
path = "src/bin/generate-fixtures.rs"

[[bin]]
name = "generate-snmp-fixtures"
path = "src/bin/generate-snmp-fixtures.rs"
required-features = ["snmp-sim"]

[[bin]]
name = "license"
path = "src/bin/license.rs"

[lib]
name = "scanopy"
path = "src/lib.rs"

# Release profile optimizations for smaller, faster binaries
[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization  
codegen-units = 1   # Better optimization, slower compile
panic = "abort"     # Smaller binaries, no unwinding
strip = true        # Remove debug symbols

# Development profile for faster builds
[profile.dev]
opt-level = 0       # No optimization for faster builds
debug = true        # Keep debug symbols for debugging
lto = false         # No LTO for faster builds
incremental = true  # Enable incremental compilation

# Dependencies grouped by purpose for better maintainability
[dependencies]
# === Web Server Framework ===
axum = "0.8.6"
tower = "0.4.13" 
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "set-header"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal", "process"] }

# === Database ===
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "ipnetwork", "mac_address"] }

# === Embedded assets ===
# Migrations are always embedded; the built UI only under `embed-ui`.
# `debug-embed` keeps debug builds reading from the compiled-in copy rather
# than from disk, so tests and dev exercise the same path production does.
# (Content types for embedded UI files come from `mime_guess`, already a
# dependency further down.)
rust-embed = { version = "8.7", features = ["debug-embed"] }

# === Serialization ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
zip = "2.2"
secrecy = { version = "0.10", features = ["serde"] }
redact = { version = "0.1", features = ["serde"] }

# === Core Utilities ===
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1.0"
thiserror = "1.0"
phf = { version = "0.11", features = ["macros"] }

# === Networking ===
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls", "cookies", "blocking"] }
# Vendored snmp2 0.5.0 + a one-line crypto-rust compile fix (see vendor/snmp2/README.md).
# crypto-rust = pure-Rust crypto backend; the openssl backend is banned (breaks musl).
# heap_buffers = move snmp2's 65KB recv_buf off the stack onto the heap. Without
# it, AsyncSession keeps `[u8; 65_507]` inline; with deep_scan_concurrency * SNMP
# session count nested in Tokio task futures, that blows the worker stack.
snmp2 = { path = "vendor/snmp2", default-features = false, features = ["tokio", "v3", "crypto-rust", "heap_buffers"] }
pnet = "0.35.0"
ipnetwork = "0.20"
cidr = { version = "0.3.1", features = ["serde"] }
if-addrs = "0.14.0"
# mDNS/DNS-SD browsing needs IP_MULTICAST_IF to choose which interface a query leaves by, and
# neither std nor tokio exposes it. Already in the tree via tokio, so this declaration adds no
# crate and no compile cost — it only makes an existing transitive dependency directly usable.
socket2 = "0.6"
# Already compiled in via tokio; declared directly because the protocol codecs below take and return
# `BytesMut`, and naming a transitive dependency is what the lint forbids rather than the dependency.
bytes = "1"
dns-lookup = "3.0.0"

# === Network Protocol Support ===
rsntp = "4.0.0"
dhcproto = "0.15.0"

# === Protocol codecs for the application probes ===
# Codec crates only — parse and serialise, no sockets. A *client* crate is the wrong shape here:
# its job is to turn a refusal into an error, where these probes treat the refusal as the positive
# (`-NOAUTH`, `421 Service not available`, KDC_ERR_PREAUTH_REQUIRED, UNSUPPORTED_VERSION). A codec
# hands back the parsed refusal and lets the probe decide, which is the judgement worth owning.
#
# Every one is `default-features = false`: several default to a native-tls or C backend, which on
# the static musl release build is a link failure rather than a runtime error.
picky-krb = { version = "0.12", default-features = false }
# picky-krb does not re-export the ASN.1 wrappers its own public types are built from, so the
# serialiser and the tag wrappers have to be named directly. Both are already in the tree as
# picky-krb's dependencies; these declarations add no crate.
picky-asn1 = { version = "0.10", default-features = false }
picky-asn1-der = { version = "0.5", default-features = false }
ironrdp-pdu = { version = "0.9", default-features = false }
ironrdp-core = { version = "0.2", default-features = false, features = ["alloc"] }
postgres-protocol = { version = "0.6", default-features = false }
# `default-features = false` is load bearing: the default pulls flate2/zlib, which is the C zlib
# backend via libz-sys. There is no libz-sys in this tree and this must not add one.
mysql_common = { version = "0.38", default-features = false }
redis-protocol = { version = "6", default-features = false, features = ["resp2", "resp3", "std"] }
# `client` is what compiles the request encoders; the compression features are left off because
# `gzip` pulls flate2 and `lz4`/`zstd` link C. Nothing here reads a record batch, so none applies.
kafka-protocol = { version = "0.18", default-features = false, features = ["client"] }
cassandra-protocol = { version = "4", default-features = false }
# `rasn`'s `bytes` feature is its backing-store choice, not an optional extra: without it the crate
# does not compile. `f32`/`f64` are left off — no LDAP message this sends or reads carries a REAL.
rasn = { version = "0.28", default-features = false, features = ["std", "bytes"] }
rasn-ldap = { version = "0.28", default-features = false }
ezk-sip-types = { version = "0.6", default-features = false }
rtsp-types = { version = "0.1", default-features = false }
onc-rpc = { version = "0.3", default-features = false }

# === TLS and Security ===
# A TLS handshake, driven only far enough to read the server's certificate. `docker_swarm`'s raft
# port on 2377 speaks mutual TLS, so the session can never complete — but the server sends its
# Certificate before demanding ours, and a custom `ServerCertVerifier` sees it there. That
# certificate names the swarm, which is the difference between detecting "a TLS listener on 2377"
# and detecting Docker Swarm.
#
# `default-features = false` + `ring` is load bearing, not tidiness: rustls 0.23 defaults its crypto
# provider to `aws-lc-rs`, which is banned here (it breaks the musl build, the same reason posthog-rs
# is pinned). There is no aws-lc-rs in the tree today and this must not be what introduces one.
# Both crates are already compiled in via reqwest, so this declaration adds no new code.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Reads the subject out of the captured certificate. Chosen over `x509-parser`, which wants
# `asn1-rs ^0.7` against the 0.6 vendored by snmp2 and would add a second asn1-rs and a third nom;
# this builds on `der`/`spki`/`const-oid`, already in the tree.
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
pem = "3"
webpki-roots = "0.25"
base64ct = "=1.6.0"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }

# === Configuration and Logging ===
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anstyle-query = "1"

# === Metrics ===
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
dotenvy = "0.15"
figment = { version = "0.10", features = ["json", "env", "toml"] }

# === CLI ===
clap = { version = "4.0", features = ["derive"] }

# === File and MIME handling ===
mime_guess = "2.0"
async-fs = "2.1.3"

# === Async utilities ===
async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7.16"
backon = "1.6"

# === System Information ===
hostname = "0.4.1"
local-ip-address = "0.6.5"
mac_address = { version = "1.1.8", features = ["serde"] }
directories-next = "2.0.0"

# === Data Structures and Algorithms ===
petgraph = { version = "0.8.2", features = ["serde-1"] }
itertools = "0.14.0"

# === Code Generation and Macros ===
strum = "0.27.2"
strum_macros = "0.27.2"
paste = "1.0"
inventory = "0.3.21"

# === OpenAPI Documentation ===
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"


# === Utilities ===
fastrand = "2.3.0"
url = "2.5.7"
rand = "0.9.2"
semver = { version = "1.0", features = ["serde"] }
lucide-icons = { version = "0.562", features = ["serde"] }

# === Dynamic Types Support ===
dyn-clone = "1.0.20"
dyn-hash = "0.2.2"
dyn-eq = "0.1.3"
ipgen = "1.0.2"
validator = { version = "0.20", features = ["derive"] }
regex = "1.11.3"
tempfile = "3.23.0"
# net-route (routing-table gateway discovery) lacks BSD support, so it is declared per-target
# below: net-route on linux/macos/windows, netdev on FreeBSD/OpenBSD. See the
# `[target.'cfg(...)']` sections near the end of this file.
bollard = { version = "0.20.2", features = ["ssl"] }
httparse = "1.10.1"
async-stream = "0.3.6"
serial_test = "3.2.0"
tower-sessions = "0.14.0"
tower-sessions-core = "0.14.0"
tower-sessions-memory-store = "0.14.0"
argon2 = "0.5.3"
password-hash = "0.5.0"
lazy_static = "1.5.0"
rand_core = "0.9.3"
axum-extra = { version = "0.10.3", features = ["cookie", "query", "typed-header"] }
time = "0.3.47"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
sha2 = "0.10.9"
hex = "0.4.3"
tokio-cron-scheduler = "0.15.1"
axum-macros = "0.5.0"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
oauth2 = { version = "5.0.0", default-features = false, features = ["rustls-tls"] }
email_address = "0.2.9"
urlencoding = "2.1.3"
rlimit = "0.10.2"
libc = "0.2.177"
async-stripe = { version = "1.0.0-alpha.2", default-features = false, features = ["rustls-tls-webpki-roots"] }
async-stripe-client-core = { version = "1.0.0-alpha.2", default-features = false }
async-stripe-shared = { version = "1.0.0-alpha.2", default-features = false }
async-stripe-core = { version = "1.0.0-alpha.2", default-features = false,features = ["customer", "customer_balance_transaction", "setup_intent"] }
async-stripe-product = { version = "1.0.0-alpha.2", default-features = false,features = ["product", "price", "coupon"] }
async-stripe-billing = { version = "1.0.0-alpha.2", default-features = false,features = ["plan", "subscription", "deserialize", "serialize", "billing_portal_session"] }
async-stripe-checkout = { version = "1.0.0-alpha.2", default-features = false,features = ["checkout_session"] }
async-stripe-types = { version = "1.0.0-alpha.2", default-features = false }
async-stripe-webhook = { version = "1.0.0-alpha.2", default-features = false }
moka = { version = "0.12.11", features = ["future"] }
nanoid = "0.4.0"
serde_with = "3.15.1"
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
html2text = "0.16.4"
json_value_merge = "2.0.1"
axum-client-ip = "1.1.3"
governor = "0.10.2"
mailchecker = "6.0.20"
hickory-resolver = { version = "0.26.1" }
const_format = "0.2.35"
posthog-rs = "0.4"
psl = "2.1.216"
idna = "1.1.0"

# === Platform-specific Dependencies ===
[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.16" }

[target.'cfg(target_family = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Foundation"
]}
# Windows Service Control Manager integration: lets the daemon run under the SCM (report
# RUNNING/STOPPED, handle the STOP control) when launched as a service by `daemon install`.
windows-service = "0.7"

# Routing-table gateway discovery. net-route has no BSD cfg arm, so it stays on the three
# desktop OSes; FreeBSD/OpenBSD use netdev (BSD gateway discovery via sysctl in-code, tested on
# FreeBSD 14). Split per-target so net-route never compiles on BSD and netdev never on the others.
[target.'cfg(not(any(target_os = "freebsd", target_os = "openbsd")))'.dependencies]
net-route = "0.4.6"

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
netdev = "0.45.0"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
walkdir = "2.5"
tar = "0.4"
testcontainers = "0.27.2"
top-english-words = "1.1.1"
comrak = "0.48.0"
jsonschema = "0.29"

[features]
generate-fixtures = []
# Compile the SNMP simulator's device definitions (`snmp::sim`) into the lib so the fixture
# generator binary can read them. Always on under `cfg(test)`; off for the shipped binaries,
# which have no use for fixture data.
snmp-sim = []
# Compile the built UI (`ui/build`) into the server binary, for the standalone
# release artifact. Off by default: the folder only exists after a UI build, so
# an unconditional embed would break `cargo build` for anyone who hasn't run
# one. The Docker image leaves this off and keeps serving /app/static.
embed-ui = []
