name: 889 Evidence

# Refreshes the NDAA Section 889 review evidence and commits it to
# compliance/ndaa-889/ on `dev`, so a signed attestation letter has one stable
# link to cite:
#
#   Human:  https://github.com/<owner>/<repo>/blob/dev/compliance/ndaa-889/EVIDENCE.md
#   JSON:   https://github.com/<owner>/<repo>/raw/dev/compliance/ndaa-889/evidence.json
#
# It commits to `dev`, not `main`: a repo ruleset locks `main` to PRs from `dev`
# (the `pr_dev_only` check), so no automation can push there. `dev` has no such
# rule, and the evidence reaches `main` automatically at the next dev->main
# release merge. `dev` is the always-current copy; `main` reflects last release.
#
# Runs tools/889/889-evidence.sh in CI, then overwrites compliance/ndaa-889/ with
# the current bundle - latest only, no per-version history. Dispatch it before a deal
# to refresh; the monthly schedule keeps it from going stale; it also auto-runs
# after a promote-to-latest so the evidence tracks production.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to assess (the production images)'
        required: false
        default: 'latest'
  schedule:
    # 08:00 UTC on the 1st of each month
    - cron: '0 8 1 * *'
  workflow_run:
    workflows: ['Promote Release to Latest']
    types: [completed]

permissions:
  contents: write
  packages: read

env:
  SYFT_VERSION: v1.45.1

jobs:
  evidence:
    name: refresh-889-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate evidence bundle
        run: |
          rm -rf compliance/ndaa-889
          ./tools/889/889-evidence.sh \
            --tag "${{ inputs.image_tag || 'latest' }}" \
            --out "$GITHUB_WORKSPACE/compliance/ndaa-889"

      - name: Commit refreshed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compliance/ndaa-889
          if git diff --cached --quiet; then
            echo "No change in 889 evidence - nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh NDAA 889 review evidence [skip ci]"
          # dev is push-able by automation; main is ruleset-locked to PRs from dev.
          git push origin HEAD:dev

      - name: Summary
        run: |
          {
            echo "## NDAA Section 889 evidence refreshed"
            echo ""
            echo "Stable links for the attestation letter (always-current copy on dev;"
            echo "also reaches main at the next release):"
            echo ""
            echo "- Evidence: https://github.com/${{ github.repository }}/blob/dev/compliance/ndaa-889/EVIDENCE.md"
            echo "- JSON: https://github.com/${{ github.repository }}/raw/dev/compliance/ndaa-889/evidence.json"
          } >> "$GITHUB_STEP_SUMMARY"
