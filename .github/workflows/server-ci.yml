name: Server CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'backend/src/server.rs'
      - 'backend/src/server/**'
      - 'backend/src/*.rs'
      - 'backend/*'
      - 'backend/migrations/**'
      - 'backend/scripts/lint-migrations.sh'
      - '.squawk.toml'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'backend/src/server.rs'
      - 'backend/src/server/**'
      - 'backend/src/*.rs'
      - 'backend/*'
      - 'backend/migrations/**'
      - 'backend/scripts/lint-migrations.sh'
      - '.squawk.toml'
      - '.github/workflows/server-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: ./backend

jobs:
  test:
    name: server-lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      
      - name: Check formatting
        run: cargo fmt -- --check

      # Fails when a dependency's licence is not in about.toml (GPL, LGPL, AGPL...). Checks the
      # licences only: the release workflow regenerates THIRD-PARTY-NOTICES.txt itself, so a new
      # dependency needs no local regeneration.
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.3 --locked --features cli

      - name: Check dependency licences
        run: cargo about generate --locked --fail about.hbs -o /dev/null

      # `--all-features` turns on `embed-ui`, whose `#[derive(Embed)]` reads `ui/build` at compile
      # time. That directory is a UI build artefact, gitignored and never built by this job, and a
      # missing folder makes the derive emit no impl at all — so the module fails to compile with
      # "no function or associated item named `get`" rather than anything to do with the code.
      # A stub is enough for the derive to generate, which keeps the module inside clippy's reach;
      # building the real UI here would cost minutes to lint a handful of lines.
      - name: Stub the embedded UI directory
        run: mkdir -p ../ui/build && { [ -f ../ui/build/index.html ] || echo '<!doctype html>' > ../ui/build/index.html; }

      - name: Clippy server
        run: cargo clippy --bin server --all-features -- -D warnings

      # Compiles without running. Nothing else on a PR builds this target, so a changed signature
      # would otherwise surface at release.
      - name: Compile integration tests
        run: cargo test --no-run --test integration

      # The OpenAPI documentation gate, ahead of the full test run so a gap fails in seconds
      # rather than after every other test. The full run below reuses this build.
      - name: Lint OpenAPI spec
        run: cargo test --lib openapi::lint

      - name: Test server binary
        run: cargo test --lib

      - name: Install squawk
        run: npm install -g squawk-cli@2.47.0

      - name: Lint migrations
        run: ./scripts/lint-migrations.sh

      - name: Build server (release)
        run: cargo build --release --bin server
