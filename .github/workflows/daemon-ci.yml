name: Daemon CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/src/daemon.rs'
      - 'backend/src/daemon/**'
      - 'backend/src/*.rs'
      - 'backend/*'
      - '.github/workflows/daemon-ci.yml'
  pull_request:
    paths:
      - 'backend/src/daemon.rs'
      - 'backend/src/daemon/**'
      - 'backend/src/*.rs'
      - 'backend/*'
      - '.github/workflows/daemon-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: ./backend

jobs:
  test:
    name: daemon-lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      # `--all-features` turns on `embed-ui`, whose `#[derive(Embed)]` reads `ui/build` at compile
      # time. The daemon bin links the same lib, and `src/lib.rs` declares `pub mod server`
      # unconditionally, so this job compiles the embed too. That directory is a UI build artefact,
      # gitignored and never built here, and a missing folder makes the derive emit no impl at all —
      # so the module fails to compile with "no function or associated item named `get`" rather than
      # anything to do with the code. A stub is enough for the derive to generate.
      - name: Stub the embedded UI directory
        run: mkdir -p ../ui/build && { [ -f ../ui/build/index.html ] || echo '<!doctype html>' > ../ui/build/index.html; }

      - name: Clippy daemon
        run: cargo clippy --bin daemon --all-features -- -D warnings
      
      - name: Test daemon binary
        run: cargo test --lib
      
      - name: Build daemon (release)
        run: cargo build --release --bin daemon
