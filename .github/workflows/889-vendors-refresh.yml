# Quarterly reminder to review the NDAA Section 889 prohibited-vendor list.
# Opens (or refreshes) a tracking issue prompting a maintainer to re-pull SAM.gov
# (FAR 52.204-25) and review ASPI, then update tools/889/889-vendors.txt. The
# issue carries a feed check (tools/889/889-candidates.sh): the 889 parties and
# their ownership-derived affiliates from a hash-checked us-restricted-parties
# release, with the ones no vendor pattern covers yet. The matcher stays
# offline; this job never edits the list itself. See tools/889/889-check.md.
name: 889 Vendor List Refresh

on:
  schedule:
    # 09:00 UTC on the 1st of Jan, Apr, Jul, Oct (quarterly)
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      release:
        description: 'us-restricted-parties release tag to check (default: newest data-* release)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A feed failure must not stop the reminder: it is reported in the issue
      # and the review falls back to the manual checklist.
      - name: Check the vendor list against the 889 feed
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if ./tools/889/889-candidates.sh ${RELEASE:+--release "$RELEASE"} > "$RUNNER_TEMP/candidates.md"; then
            cat "$RUNNER_TEMP/candidates.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Feed check failed; see the workflow run log. Use the manual checklist above._" > "$RUNNER_TEMP/candidates.md"
          fi

      - name: Open or update the quarterly review issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const feed = fs.readFileSync(`${process.env.RUNNER_TEMP}/candidates.md`, 'utf8');
            const title = 'Quarterly review: NDAA Section 889 vendor list';
            const body = [
              'Time for the quarterly review of `tools/889/889-vendors.txt`.',
              '',
              '- [ ] Re-pull the SAM.gov Exclusions extract filtered to FAR 52.204-25',
              '      (https://sam.gov/data-services/Exclusions/Public) and add any new',
              '      covered parties as patterns.',
              '- [ ] Review ASPI "Mapping China\'s Tech Giants"',
              '      (https://chinatechmap.aspi.org.au/) for new affiliates.',
              '- [ ] Confirm the five named entities and known subsidiaries are still current.',
              '- [ ] Update the `date` stamp on any reviewed/added rows.',
              '- [ ] Re-check `tools/889/889-allow.txt` exceptions still apply.',
              '',
              'Methodology and rationale: `tools/889/889-check.md`.',
              '',
              feed,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: '889-vendor-review',
              state: 'open',
              per_page: 100,
            });

            if (existing.data.length > 0) {
              const n = existing.data[0].number;
              console.log(`Open review issue already exists: #${n} — adding a nudge comment.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: n,
                body: ['Quarterly reminder: this 889 vendor-list review is still open.', '', feed].join('\n'),
              });
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['889-vendor-review'],
            });
            console.log(`Opened review issue #${created.data.number}`);
