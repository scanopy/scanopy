name: Promote Release to Latest

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to promote to latest (e.g., v1.0.0)'
        required: true
        type: string
      generate_social:
        description: 'Generate social post (Tweet/Bluesky/Discord)'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  promote-to-latest:
    name: Promote Release to Latest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Validate release exists and get details
        id: release
        run: |
          RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.release_tag }}")

          if [ "$(echo $RELEASE | jq -r '.message')" = "Not Found" ]; then
            echo "Release ${{ inputs.release_tag }} not found"
            exit 1
          fi

          echo "Release found: ${{ inputs.release_tag }}"

          # Extract release details for later steps
          echo "release_id=$(echo $RELEASE | jq -r '.id')" >> $GITHUB_OUTPUT
          echo "release_name=$(echo $RELEASE | jq -r '.name')" >> $GITHUB_OUTPUT
          echo "release_url=$(echo $RELEASE | jq -r '.html_url')" >> $GITHUB_OUTPUT

          # Handle multiline body
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "release_body<<$EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE" | jq -r '.body' >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Mark release as latest
        run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ steps.release.outputs.release_id }}" \
            -d '{"make_latest": "true", "prerelease": false, "draft": false}'

          echo "Marked ${{ inputs.release_tag }} as latest release"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest for Server (GHCR)
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}/server:latest \
            ghcr.io/${{ github.repository }}/server:${{ inputs.release_tag }}

      - name: Create multi-arch manifest for Daemon (GHCR)
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}/daemon:latest \
            ghcr.io/${{ github.repository }}/daemon:${{ inputs.release_tag }}

      - name: Checkout scanopy repo (dev branch for the schema files and contributors)
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout website repo
        uses: actions/checkout@v7
        with:
          repository: scanopy/website
          token: ${{ secrets.SYNC_FIXTURES_TO_WEBSITE_TOKEN }}
          path: website

      # release.yml attaches the fixtures and logos it generated for this tag, so the website
      # gets what the release shipped without compiling the generator again.
      - name: Download UI fixtures and service logos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.release_tag }}" --repo "${{ github.repository }}" --pattern ui-fixtures.tar.gz
          tar -xzf ui-fixtures.tar.gz

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Copy fixtures to website repo
        run: |
          mkdir -p website/src/lib/fixtures/
          cp ui/src/lib/data/services.json website/src/lib/fixtures/
          cp ui/src/lib/data/features.json website/src/lib/fixtures/
          cp ui/src/lib/data/product-areas.json website/src/lib/fixtures/
          cp ui/src/lib/data/billing-plans.json website/src/lib/fixtures/
          cp ui/src/lib/data/integrations.json website/src/lib/fixtures/
          cp ui/src/lib/data/collected-data.json website/src/lib/fixtures/
          # Rendered directly by docs pages instead of being restated in prose
          # (website/docs/src/components/). generate-fixtures emits more than we
          # sync — add a line here when a docs page starts consuming one.
          cp ui/src/lib/data/permissions.json website/src/lib/fixtures/
          cp ui/src/lib/data/scan-settings.json website/src/lib/fixtures/
          cp ui/src/lib/data/ssh-script-fields.json website/src/lib/fixtures/
          cp ui/src/lib/data/element-rule-types.json website/src/lib/fixtures/
          cp ui/src/lib/data/container-rule-types.json website/src/lib/fixtures/
          cp ui/src/lib/data/server-config.json website/src/lib/fixtures/
          cp ui/src/lib/data/snmp.json website/src/lib/fixtures/
          cp ui/src/lib/data/views.json website/src/lib/fixtures/
          cp ui/src/lib/data/warning-codes.json website/src/lib/fixtures/
          cp ui/src/lib/data/warning-remedies.json website/src/lib/fixtures/
          cp ui/src/lib/data/identity-provider-logos.json website/src/lib/fixtures/
          cp ui/src/lib/data/logos.json website/src/lib/fixtures/
          cp ui/src/lib/data/logo-credits.json website/src/lib/fixtures/
          cp ui/static/openapi-public.json website/src/lib/fixtures/openapi.json
          cp ui/static/schema.mermaid website/src/lib/fixtures/schema.mermaid
          cp ui/static/schema-er.mermaid website/src/lib/fixtures/schema-er.mermaid
          cp ui/static/entity-metadata.json website/src/lib/fixtures/entity-metadata.json
          # Replaced whole, so a logo dropped from the catalog leaves the site too.
          mkdir -p website/static/logos/
          rm -rf website/static/logos/catalog
          cp -r ui/static/logos/catalog website/static/logos/catalog

      - name: Generate daemon config fixture
        run: |
          cd ui && npm ci --ignore-scripts
          npx svelte-kit sync
          npx paraglide-js compile --outdir ./src/lib/paraglide --silent
          npx vite-node scripts/export-daemon-field-defs.ts docs --output=../website/src/lib/fixtures/daemon-config.json 2>/dev/null

      - name: Get previous release tag
        id: prev_tag
        run: |
          # Get all version tags sorted, find the one before current release
          PREV_TAG=$(git tag -l 'v*' | sort -V | grep -B1 "^${{ inputs.release_tag }}$" | head -1)
          if [ "$PREV_TAG" = "${{ inputs.release_tag }}" ] || [ -z "$PREV_TAG" ]; then
            # Fallback: get the tag before this one by commit order
            PREV_TAG=$(git describe --tags --abbrev=0 ${{ inputs.release_tag }}^ 2>/dev/null || echo "")
          fi
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, using initial commit"
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Collect contributors
        id: diff
        run: |
          CONTRIBUTORS=$(git log --pretty=format:"%an" \
            ${{ steps.prev_tag.outputs.prev_tag }}..${{ inputs.release_tag }} \
            | sort -u | grep -v "github-actions" | tr '\n' ', ' | sed 's/,$//')
          echo "contributors=$CONTRIBUTORS" >> $GITHUB_OUTPUT

      # The notes were generated by prepare_release.yml and reviewed in the
      # release PR before the build, and the server embeds that same file. Read
      # the copy at the tag, so the website shows what the release shipped.
      - name: Read reviewed release notes
        id: cleaned_notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          FILE="backend/release-notes/${RELEASE_TAG}.md"
          if ! SOURCE=$(git show "${RELEASE_TAG}:${FILE}"); then
            echo "::error::${FILE} is missing at ${RELEASE_TAG}. Releases are prepared with prepare_release.yml, which writes it."
            exit 1
          fi
          # Frontmatter is the block between the first two `---` lines; the body follows it.
          TITLE=$(printf '%s\n' "$SOURCE" | awk 'NR==1 && /^---$/ {fm=1; next} fm && /^---$/ {exit} fm && /^title:/ {sub(/^title:[ ]*/, ""); print}')
          TITLE=$(printf '%s' "$TITLE" | sed -e "s/^'\(.*\)'$/\1/" -e "s/''/'/g")
          NOTES=$(printf '%s\n' "$SOURCE" | awk 'NR==1 && /^---$/ {fm=1; next} fm && /^---$/ {fm=0; body=1; next} body {print}')

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "notes<<$EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Generate social post
        id: social
        run: .github/scripts/claude-generate.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JSON_SCHEMA: '{"type":"object","properties":{"social_post":{"type":"string"}},"required":["social_post"],"additionalProperties":false}'
          PROMPT: |
            Generate a social media post for a software release. Return it in the `social_post` field.

            Requirements:
            social_post: A short post for Twitter/Bluesky (max 175 characters). Version number and changelog URL are auto-added, so exclude them. Requirements:
               - Use bullet points (•) to list key highlights, as a single-line string using a literal backslash-n between bullets (e.g. "• First item\n• Second item"). It must not contain real line breaks — it is written into single-line YAML frontmatter.
               - Write naturally and clearly - prioritize readability over cramming in content
               - NOT promotional language
               - No version number, hashtags, or URLs

            ---

            Based on these release notes for Scanopy ${{ inputs.release_tag }}:

            ${{ steps.cleaned_notes.outputs.notes }}

      - name: Parse social outputs
        id: parsed
        env:
          # The title is the one reviewed in the release PR, from the notes file.
          TITLE: ${{ steps.cleaned_notes.outputs.title }}
          SOCIAL_POST: ${{ fromJSON(steps.social.outputs.structured_output || '{}').social_post }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # The schema asks for a single-line social post (a literal \n between
          # bullets) because it lands in single-line YAML frontmatter, but the
          # model does not reliably comply. Collapse any real newlines here
          # rather than trusting the instruction: a multi-line value breaks
          # both the key=value write below and the changelog frontmatter.
          to_single_line() {
            printf '%s' "$1" | awk 'NR>1 {printf "\\n"} {printf "%s", $0}'
          }
          TITLE=$(to_single_line "$TITLE")
          SOCIAL_POST=$(to_single_line "$SOCIAL_POST")

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "social_post=$SOCIAL_POST" >> $GITHUB_OUTPUT

          # Get version without v prefix
          VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "Title: $TITLE"
          echo "Social post: $SOCIAL_POST"

      - name: Create changelog file
        env:
          VERSION: ${{ steps.parsed.outputs.version }}
          TITLE: ${{ steps.parsed.outputs.title }}
          SOCIAL_POST: ${{ steps.parsed.outputs.social_post }}
          GEN_SOCIAL: ${{ inputs.generate_social }}
          CONTRIBUTORS: ${{ steps.diff.outputs.contributors }}
          NOTES: ${{ steps.cleaned_notes.outputs.notes }}
          REPO: ${{ github.repository }}
          PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p website/src/lib/changelog
          DATE=$(date -u +%Y-%m-%d)

          # Only carry the social post text when social generation is enabled
          if [ "$GEN_SOCIAL" = "true" ]; then
            SOCIAL_POST_LINE="$SOCIAL_POST"
          else
            SOCIAL_POST_LINE=""
          fi

          # Emit model-authored values as single-quoted YAML scalars. Unquoted
          # they corrupt the frontmatter as soon as a title or bullet contains
          # ": ", and single quotes (unlike double) keep the literal \n in the
          # social post rather than expanding it to a newline at parse time.
          yaml_quote() {
            printf "'%s'" "$(printf '%s' "$1" | sed "s/'/''/g")"
          }

          {
            echo "---"
            echo "version: ${VERSION}"
            echo "date: ${DATE}"
            echo "title: $(yaml_quote "${TITLE}")"
            echo "social_post: $(yaml_quote "${SOCIAL_POST_LINE}")"
            echo "publish_social: ${GEN_SOCIAL}"
            echo "contributors: $(yaml_quote "${CONTRIBUTORS}")"
            echo "---"
            echo ""
            printf '%s\n' "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${RELEASE_TAG}"
          } > "website/src/lib/changelog/${RELEASE_TAG}.md"

      - name: Commit and push fixtures to website repo
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/fixtures/ static/logos/catalog/
          if git diff --staged --quiet; then
            echo "No fixture changes to commit"
          else
            git commit -m "chore: sync fixtures from ${{ inputs.release_tag }}"
            git push
          fi

      - name: Create PR for changelog review
        working-directory: website
        env:
          GH_TOKEN: ${{ secrets.SYNC_FIXTURES_TO_WEBSITE_TOKEN }}
          GEN_SOCIAL: ${{ inputs.generate_social }}
          SOCIAL_POST: ${{ steps.parsed.outputs.social_post }}
        run: |
          BRANCH="changelog/${{ inputs.release_tag }}"

          # Delete remote branch if it exists (from a previous failed run)
          git push origin --delete "$BRANCH" 2>/dev/null || true

          # Create and switch to new branch
          git checkout -b "$BRANCH"

          git add src/lib/changelog/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi

          git commit -m "docs: add release notes for ${{ inputs.release_tag }}"
          git push -u origin "$BRANCH"

          # Build PR body into a temp file to avoid quoting issues
          {
            echo "## Release Notes: ${{ inputs.release_tag }}"
            echo ""
            echo "### Review Checklist"
            echo "The notes and title were reviewed in the release PR and ship in the server image. Fix a mistake there for the next release."

            if [ "$GEN_SOCIAL" = "true" ]; then
              echo "- [ ] Review social post"
            fi

            echo ""
            echo "### Auto-published on merge"
            echo "- Changelog on scanopy.net"

            if [ "$GEN_SOCIAL" = "true" ]; then
              echo "- Discord notification"
              echo "- Tweet + Bluesky post"
            fi

            echo ""
            echo "---"

            if [ "$GEN_SOCIAL" = "true" ]; then
              echo "### Draft: Social Post"
              echo "> ${SOCIAL_POST}"
              echo ""
            fi

            echo ""
            echo "---"
            echo "*Generated with Claude*"
          } > /tmp/pr_body.md

          # Create PR
          gh pr create \
            --title "Release Notes: ${{ inputs.release_tag }} - ${{ steps.parsed.outputs.title }}" \
            --body-file /tmp/pr_body.md \
            --base main \
            --head "$BRANCH"

          echo "PR created for changelog review"
