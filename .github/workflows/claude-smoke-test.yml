# Throwaway workflow to validate the Claude API wiring used by
# promote_to_latest.yml — the ANTHROPIC_API_KEY secret and the schema-
# constrained JSON round trip. Run it once from the Actions tab; delete this
# file once promote_to_latest has had a successful release run.
name: Claude Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Claude Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate structured output
        id: probe
        run: .github/scripts/claude-generate.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JSON_SCHEMA: '{"type":"object","properties":{"title":{"type":"string"},"body":{"type":"string"}},"required":["title","body"],"additionalProperties":false}'
          PROMPT: |
            Return a short made-up release title in `title`, and in `body` a
            two-paragraph markdown blurb containing a "quoted phrase", an
            apostrophe, a $dollar sign, a 100% figure, and a backtick `code
            span` — this is checking that awkward characters survive the
            round trip intact.

      - name: Show what came back
        env:
          RAW: ${{ steps.probe.outputs.structured_output }}
          TITLE: ${{ fromJSON(steps.probe.outputs.structured_output || '{}').title }}
          BODY: ${{ fromJSON(steps.probe.outputs.structured_output || '{}').body }}
        run: |
          echo "raw structured_output:"
          printf '%s\n\n' "$RAW"
          echo "title: $TITLE"
          echo
          echo "body:"
          printf '%s\n' "$BODY"

          if [ -z "$TITLE" ] || [ -z "$BODY" ]; then
            echo "FAIL: a schema field came back empty."
            exit 1
          fi
          echo
          echo "PASS: API key, structured outputs, and fromJSON wiring all work."
