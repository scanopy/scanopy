name: Prepare Release

# Happy path: prepare -> merge the notes PR (publishes) -> promote.
#
# - While `dev` has no backend/release-notes/vX.Y.Z.md, this bumps the version on
#   release/vX.Y.Z, generates the release notes, and opens a PR into dev. Edit the
#   notes, their `email`, `modal` and `daemon_upgrade` flags and the PR's Deploy-Mode
#   line, then merge it. The merge runs publish_release.yml, which creates the release that
#   release.yml builds. Running this again before the merge regenerates the notes onto the PR.
# - Once the notes are on dev, this skips straight to publish_release.yml. That is
#   the retry after a failed publish or build: re-run this workflow, and the
#   reviewed notes are reused.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.11.3)'
        required: true
        type: string
      deploy_mode:
        description: 'Deploy compatibility mode (controls backward-compat checks + image label)'
        required: false
        default: 'backward-compatible'
        type: choice
        options:
          - backward-compatible
          - downtime
      announcement:
        description: 'How users hear about this release when servers upgrade. A daemon upgrade notice adds an upgrade section to the notes and marks older daemons Outdated, so it always goes out by email and modal. Used when the notes are generated.'
        required: false
        default: 'No email or modal'
        type: choice
        options:
          - 'No email or modal'
          - 'Email and modal'
          - 'Email and modal with daemon upgrade notice'
      email_licensed_owners:
        description: 'Scanopy Cloud emails self-hosted licence owners the release notes with an upgrade link, even when the release emails no one else (when it emails everyone, licence owners get this version of it either way). Used when the notes are generated.'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

permissions: {}

jobs:
  prepare-notes:
    name: Prepare Release Notes
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: dev
        fetch-depth: 0
        fetch-tags: true
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Validate version format
      run: |
        if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Invalid version format. Use semver (e.g., 0.11.3)"
          exit 1
        fi

    # A terms notice links to scanopy.net/<page>/<effective>. Stop here, in either
    # phase, until those pages are on the website's main branch.
    - name: Check terms pages are on the website
      env:
        GH_TOKEN: ${{ secrets.SYNC_FIXTURES_TO_WEBSITE_TOKEN }}
      run: .github/scripts/check-terms-pages.sh

    - name: Choose phase
      id: phase
      run: |
        NOTES_FILE="backend/release-notes/v${{ inputs.version }}.md"
        echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT
        if [ -f "$NOTES_FILE" ]; then
          echo "Release notes are on dev: publishing the release"
          echo "phase=release" >> $GITHUB_OUTPUT
        else
          echo "No release notes on dev yet: generating them for review"
          echo "phase=notes" >> $GITHUB_OUTPUT
        fi

    # ── Phase 1: notes for review ────────────────────────────────────────────

    - name: Switch to the release branch
      if: steps.phase.outputs.phase == 'notes'
      run: git checkout -B "release/v${{ inputs.version }}"

    - name: Get previous release tag
      id: prev_tag
      if: steps.phase.outputs.phase == 'notes'
      env:
        TAG: v${{ inputs.version }}
      run: |
        # The newest tag that sorts before this version. The tag itself doesn't exist yet.
        PREV_TAG=$( { git tag -l 'v*'; echo "$TAG"; } | sort -uV | grep -B1 -x "$TAG" | head -1)
        if [ "$PREV_TAG" = "$TAG" ]; then
          PREV_TAG=$(git rev-list --max-parents=0 HEAD)
        fi
        echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
        echo "Previous tag: $PREV_TAG"

    - name: Collect commits since the previous release
      id: diff
      if: steps.phase.outputs.phase == 'notes'
      run: |
        PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
        COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges "$PREV_TAG"..HEAD | head -100)
        MERGES=$(git log --pretty=format:"%s" --merges "$PREV_TAG"..HEAD \
          | grep -oE '#[0-9]+' | sort -u | tr '\n' ' ' || true)

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "commits<<$EOF" >> $GITHUB_OUTPUT
        echo "$COMMITS" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "Related PRs: $MERGES" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT

    - name: Generate release notes with AI
      id: ai_notes
      if: steps.phase.outputs.phase == 'notes'
      run: .github/scripts/claude-generate.sh
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        JSON_SCHEMA: '{"type":"object","properties":{"title":{"type":"string","description":"A short title for the release"},"notes":{"type":"string","description":"The release notes in markdown"}},"required":["title","notes"],"additionalProperties":false}'
        PROMPT: |
          Write the release notes described below and return them in the `notes` field, with a title in the `title` field.

          You are a technical writer creating release notes for Scanopy, a network discovery and topology visualization tool. Write concise, user-focused release notes. Aim for quality over coverage — a shorter changelog that users actually read is better than an exhaustive one they skip. The notes appear in the app, in an email to users, and on the website changelog.

          Title requirements:
          - 3-6 words summarizing the key changes. NOT promotional. No version number. Examples: "Topology Sharing & Demo Mode", "Performance Improvements & Bug Fixes", "Enhanced Network Discovery"

          Format requirements:
          - Do NOT include a top-level title heading (e.g., "# Scanopy vX.Y.Z Release Notes"). The title is returned separately.
          - Do NOT include images or image references. The notes are text and links only.
          - If the changes have a clear theme or focus (e.g., "This release is all about topology navigation"), start with 1-2 sentences summarizing it before the first ## section. Keep it conversational and brief. If there's no cohesive theme, skip this and go straight to the sections.
          - Use markdown with ## headers for sections: New Features, Improvements, Bug Fixes (only include sections with content)
          - Each item should be a bullet point starting with an action verb (Add, Introduce, Improve, Fix, etc.)
          - Each item should be 1 sentence explaining the user-facing benefit. Write for an end-user, not a developer — describe what they can now do or what got better, not how it was implemented internally.
          - Format PR/issue references as markdown links: ([#123](https://github.com/scanopy/scanopy/pull/123))
          - Combine related commits into single items

          CRITICAL — Deduplication rules:
          - If a feature is NEW in this release, do NOT list its related improvements, polish, or bug fixes as separate items. Those are part of shipping the feature — fold them into the New Features entry or omit them entirely. Only list improvements/fixes for EXISTING features that users already had before this release.
          - Multiple commits touching the same feature should be ONE bullet point, not several.

          Brevity rules:
          - Aim for 3-6 New Features, 3-6 Improvements, and 3-6 Bug Fixes maximum. Fewer is fine. Not every commit needs representation.
          - Skip trivial fixes, minor UI polish, and internal changes that users won't notice.
          - Avoid implementation details. Bad: "Gate controls based on FirstDiscoveryCompleted milestone instead of rebuild". Good: "Hide advanced controls until your first scan completes, so the UI is less overwhelming for new users".

          Example of good release note items:
          - Add topology sharing, allowing you to share network maps via direct link or embed code ([#95](https://github.com/scanopy/scanopy/pull/95)).
          - Improve subnet layout so large networks render without overlapping nodes ([#107](https://github.com/scanopy/scanopy/pull/107)).
          - Fix duplicate host entries that could appear after re-running network discovery ([#108](https://github.com/scanopy/scanopy/pull/108)).

          Do NOT include:
          - Version bump commits (chore: bump version)
          - Merge commits
          - CI/CD or workflow changes
          - Test-only changes
          - Internal refactoring unless user-visible
          - Improvements or fixes to features that are brand new in this same release

          ---

          Generate release notes for Scanopy v${{ inputs.version }}.
          Previous version: ${{ steps.prev_tag.outputs.prev_tag }}
          Repository: https://github.com/scanopy/scanopy

          Commits since last release:
          ${{ steps.diff.outputs.commits }}

    - name: Set the release's announcement flags
      id: announcement
      if: steps.phase.outputs.phase == 'notes'
      env:
        CHOICE: ${{ inputs.announcement }}
      run: |
        case "$CHOICE" in
          'Email and modal with daemon upgrade notice') NOTES_OUT=true; DAEMON_UPGRADE=true ;;
          'Email and modal') NOTES_OUT=true; DAEMON_UPGRADE=false ;;
          *) NOTES_OUT=false; DAEMON_UPGRADE=false ;;
        esac
        echo "email=$NOTES_OUT" >> $GITHUB_OUTPUT
        echo "modal=$NOTES_OUT" >> $GITHUB_OUTPUT
        echo "daemon_upgrade=$DAEMON_UPGRADE" >> $GITHUB_OUTPUT
        echo "email and modal: $NOTES_OUT, daemon_upgrade: $DAEMON_UPGRADE"

    - name: Install Rust
      if: steps.phase.outputs.phase == 'notes'
      uses: dtolnay/rust-toolchain@1.90.0

    - name: Bump version and write the notes file
      if: steps.phase.outputs.phase == 'notes'
      env:
        VERSION: ${{ inputs.version }}
        NOTES_FILE: ${{ steps.phase.outputs.notes_file }}
        TITLE: ${{ fromJSON(steps.ai_notes.outputs.structured_output || '{}').title }}
        RAW_NOTES: ${{ fromJSON(steps.ai_notes.outputs.structured_output || '{}').notes }}
        EMAIL: ${{ steps.announcement.outputs.email }}
        MODAL: ${{ steps.announcement.outputs.modal }}
        LICENSED_EMAIL: ${{ inputs.email_licensed_owners == 'yes' }}
        DAEMON_UPGRADE: ${{ steps.announcement.outputs.daemon_upgrade }}
      run: |
        sed -i "s/^version = .*/version = \"$VERSION\"/" backend/Cargo.toml
        (cd backend && cargo check --quiet)
        (cd ui && npm version "$VERSION" --no-git-tag-version --allow-same-version)

        # Strip any h1 headings the AI might have added (the title is in frontmatter).
        NOTES=$(printf '%s\n' "$RAW_NOTES" | sed '/^# /d')
        # Single-quoted YAML scalar: a literal apostrophe is doubled.
        TITLE=$(printf '%s' "$TITLE" | tr '\n' ' ' | sed "s/'/''/g")
        mkdir -p backend/release-notes
        {
          echo "---"
          echo "version: ${VERSION}"
          echo "date: $(date -u +%Y-%m-%d)"
          echo "title: '${TITLE}'"
          echo "email: ${EMAIL}"
          echo "modal: ${MODAL}"
          echo "licensed_email: ${LICENSED_EMAIL}"
          echo "daemon_upgrade: ${DAEMON_UPGRADE}"
          echo "---"
          echo ""
          printf '%s\n' "$NOTES"
          if [ "$DAEMON_UPGRADE" = "true" ]; then
            echo ""
            echo "## Upgrade your daemons"
            echo ""
            echo "This release asks you to upgrade your daemons. Open Discover > Daemons and upgrade each daemon marked Outdated. See [Upgrading Daemons](https://scanopy.net/docs/setting-up-daemons/upgrading-daemons/)."
          fi
        } > "$NOTES_FILE"
        cat "$NOTES_FILE"

    - name: Open the release notes PR
      if: steps.phase.outputs.phase == 'notes'
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        VERSION: ${{ inputs.version }}
        DEPLOY_MODE: ${{ inputs.deploy_mode }}
        NOTES_FILE: ${{ steps.phase.outputs.notes_file }}
        EMAIL: ${{ steps.announcement.outputs.email }}
        MODAL: ${{ steps.announcement.outputs.modal }}
        LICENSED_EMAIL: ${{ inputs.email_licensed_owners == 'yes' }}
        DAEMON_UPGRADE: ${{ steps.announcement.outputs.daemon_upgrade }}
        PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
      run: |
        BRANCH="release/v${VERSION}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add backend/Cargo.toml backend/Cargo.lock ui/package.json ui/package-lock.json "$NOTES_FILE"
        git commit -m "chore: release notes and version bump for v${VERSION}"
        git push --force origin "$BRANCH"

        if [ "$EMAIL" = "true" ]; then
          EMAIL_LINE="\`email: true\`: servers that upgrade to v${VERSION} email these notes to every user. On Scanopy Cloud, self-hosted licence owners get them with an upgrade link instead."
        else
          EMAIL_LINE="\`email: false\`: the notes show in the app only. Set it to \`true\` to email them."
        fi
        if [ "$EMAIL" = "true" ]; then
          LICENSED_LINE="\`licensed_email: ${LICENSED_EMAIL}\`: no effect, because \`email: true\` already sends licence owners the upgrade version."
        elif [ "$LICENSED_EMAIL" = "true" ]; then
          LICENSED_LINE="\`licensed_email: true\`: Scanopy Cloud emails these notes with an upgrade link to self-hosted licence owners only."
        else
          LICENSED_LINE="\`licensed_email: false\`: licence owners get no email. Set it to \`true\` to send them these notes with an upgrade link."
        fi
        if [ "$MODAL" = "true" ]; then
          MODAL_LINE="\`modal: true\`: users see the release notes modal after the upgrade."
        else
          MODAL_LINE="\`modal: false\`: the modal doesn't open for this release. Its notes show the next time a release opens it. Set it to \`true\` to open it now."
        fi
        if [ "$DAEMON_UPGRADE" = "true" ]; then
          DAEMON_UPGRADE_LINE="\`daemon_upgrade: true\`: daemons older than v${VERSION} show Outdated, and the notes end with an upgrade section. It needs \`email: true\` and \`modal: true\`. Re-run Prepare Release to change it."
        else
          DAEMON_UPGRADE_LINE="\`daemon_upgrade: false\`: daemons stay current against the last release that asked. Re-run Prepare Release with the daemon upgrade notice when this release changes a daemon capability or the daemon wire format: those warnings fire whatever the flag says."
        fi
        # Terms updates added since the last release. Cloud emails each one on deploy.
        TERMS_FILES=$(git diff --name-only --diff-filter=A "$PREV_TAG"..HEAD -- backend/release-notes/terms/ \
          | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' || true)

        # publish_release.yml reads the Deploy-Mode line when this PR is merged.
        {
          echo "Deploy-Mode: ${DEPLOY_MODE}"
          echo ""
          echo "Release notes for v${VERSION}. Servers embed this file at build time: it fills the in-app release notes modal and the release email."
          echo ""
          echo "- [ ] Edit \`${NOTES_FILE}\` until it reads right"
          echo "- [ ] Check the \`email\` flag. ${EMAIL_LINE}"
          echo "- [ ] Check the \`modal\` flag. ${MODAL_LINE}"
          echo "- [ ] Check the \`licensed_email\` flag. ${LICENSED_LINE}"
          echo "- [ ] Check the \`daemon_upgrade\` flag. ${DAEMON_UPGRADE_LINE}"
          echo "- [ ] Check the Deploy-Mode line above (\`backward-compatible\` or \`downtime\`)"
          echo "- [ ] If the notes use an image, commit it to website \`main\` at \`static/changelog/v${VERSION}/\` before merging (see \`backend/release-notes/README.md\`)"
          for TERMS_FILE in $TERMS_FILES; do
            echo "- [ ] Read the terms update \`${TERMS_FILE}\`. Scanopy Cloud emails it to every user once v${VERSION} deploys."
          done
          echo ""
          echo "Merging this PR publishes v${VERSION}: it creates the release, which builds the images. If the publish or the build fails, re-run **Prepare Release** for \`${VERSION}\`; it reuses these notes."
        } > "$RUNNER_TEMP/pr_body.md"

        if [ -n "$(gh pr list --head "$BRANCH" --base dev --state open --json number -q '.[].number')" ]; then
          gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr_body.md"
          echo "Updated the open PR for $BRANCH"
        else
          gh pr create --base dev --head "$BRANCH" \
            --title "Release notes for v${VERSION}" \
            --body-file "$RUNNER_TEMP/pr_body.md"
        fi

  # Notes already on dev: the PR was merged, so this run is a retry of the publish.
  publish:
    name: Publish Release
    needs: prepare-notes
    if: needs.prepare-notes.outputs.phase == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/publish_release.yml
    with:
      version: ${{ inputs.version }}
      deploy_mode: ${{ inputs.deploy_mode }}
    secrets: inherit
