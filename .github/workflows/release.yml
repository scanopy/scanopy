name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  test-and-update-fixtures:
    name: Run Tests and Update Fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install tbls
        run: |
          curl -sL https://github.com/k1LoW/tbls/releases/download/v1.79.3/tbls_v1.79.3_linux_amd64.tar.gz | tar xz
          sudo mv tbls /usr/local/bin/
          tbls version

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes
          df -h
                  
      - name: Generate UI fixtures before container build
        run: make generate-fixtures

      # Best-effort per source: a failed download keeps the committed copy.
      # Runs before the tests so the classifier's floor + ground-truth
      # invariants validate refreshed data before it is committed or baked
      # into the Docker images.
      - name: Refresh vendored data (oui.csv + domain-classification)
        run: backend/scripts/refresh-vendored-data.sh

      - name: Run all tests
        run: |
          make dev-down
          rm -rf ./data/daemon_config/*
          export DATABASE_URL="postgresql://postgres:password@localhost:5432/scanopy_test"
          cd backend && cargo test --features generate-fixtures -- --nocapture --test-threads=1

      - name: Show container logs on test failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs
          docker compose -f docker-compose.test.yml ps
          
      - name: Cleanup containers
        if: always()
        run: make dev-down
      
      - name: Commit and push fixture updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/Cargo.toml backend/Cargo.lock ui/package.json ui/package-lock.json
          git add backend/src/tests/scanopy.sql backend/src/tests/daemon_config.json ui/static/services.json ui/static/schema.mermaid ui/static/schema-er.mermaid ui/static/entity-metadata.json
          git add backend/tests/integration/compat/fixtures/
          git add backend/assets/oui.csv backend/assets/domain-classification/

          if git diff --staged --quiet; then
            echo "No fixture changes to commit"
          else
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
            git commit -m "chore: update test fixtures for release ${{ github.event.release.tag_name }}"
            git push origin "$BRANCH_NAME"
            echo "✅ Pushed fixture updates to $BRANCH_NAME"
          fi

      - name: Upload generated UI fixtures
        uses: actions/upload-artifact@v4
        with:
          name: ui-fixtures
          path: ui/src/lib/data/*.json
          retention-days: 1

      # `generate-fixtures` also downloads service logos, to a different tree.
      # The Docker build gets them by running the generator inside its own
      # rust-builder stage; the standalone UI build (build-ui) has no Rust
      # toolchain, so it needs them as an artifact.
      - name: Upload generated service logos
        uses: actions/upload-artifact@v4
        with:
          name: ui-logos
          path: ui/static/logos/services/
          retention-days: 1

  migration-branch-test:
    name: Test migrations on Neon branch
    runs-on: ubuntu-latest
    needs: test-and-update-fixtures
    permissions:
      contents: read
    outputs:
      deploy_mode: ${{ steps.deploy_mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      # Cache the backend build so `cargo run --bin migrate` isn't a cold
      # compile every release — matters most in downtime mode, where the later
      # `cargo test --lib` step is skipped and this is the job's only build.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Parse deploy mode from release body
        id: deploy_mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Re-fetch the live release body via the API instead of trusting
          # github.event.release.body, which is a snapshot from the moment
          # release.published fired. If the Deploy-Mode marker was added by
          # an edit *after* publish (or any other post-create flow), the
          # event payload wouldn't reflect it.
          RELEASE_BODY=$(gh release view "$TAG" --json body -q '.body')
          if echo "$RELEASE_BODY" | grep -iq '^Deploy-Mode:[[:space:]]*downtime'; then
            MODE=downtime
          else
            MODE=backward-compatible
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy mode"
            echo ""
            echo "Resolved to: \`$MODE\`"
            if [ "$MODE" = "downtime" ]; then
              echo ""
              echo "Release body declared \`Deploy-Mode: downtime\` — the backward-compat container harness and DB-enum coexistence tests will be skipped. Built images will be labeled \`org.scanopy.deploy_mode=downtime\` for the deployer."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute branch expiration (24h safety net)
        run: echo "EXPIRES_AT=$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon branch off prod
        id: create_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: release/${{ github.event.release.tag_name }}-migration-check
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Snapshot schema before migrations
        run: |
          pg_dump --schema-only --no-owner --no-privileges "$DATABASE_URL" \
            | grep -Ev '^\\(un)?restrict' > /tmp/before.sql
        env:
          DATABASE_URL: ${{ steps.create_branch.outputs.db_url }}

      - name: Apply migrations
        working-directory: backend
        # Use the project's own migration runner (the same code path the server
        # runs at startup), NOT `sqlx migrate run`. sqlx-cli sends each migration
        # as a single multi-statement batch, which Postgres executes in an
        # implicit transaction — so `-- no-transaction` migrations containing
        # `CREATE INDEX CONCURRENTLY` fail ("cannot run inside a transaction
        # block"). The custom runner splits statements, matching prod-app
        # behavior, so the release check exercises migrations exactly as prod will.
        run: cargo run --bin migrate -- --database-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ steps.create_branch.outputs.db_url }}

      - name: Snapshot schema after migrations and write diff to job summary
        run: |
          pg_dump --schema-only --no-owner --no-privileges "$DATABASE_URL" \
            | grep -Ev '^\\(un)?restrict' > /tmp/after.sql
          {
            echo "## Migration schema delta — ${{ github.event.release.tag_name }}"
            echo ""
            if diff -q /tmp/before.sql /tmp/after.sql >/dev/null; then
              echo "_No schema changes were applied._"
            else
              echo '```diff'
              diff -u /tmp/before.sql /tmp/after.sql || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL: ${{ steps.create_branch.outputs.db_url }}

      - name: Log in to GHCR for compat-check image pull
        if: steps.deploy_mode.outputs.mode != 'downtime'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull previous release image (before warming Neon)
        if: steps.deploy_mode.outputs.mode != 'downtime'
        run: |
          # Pull the slow image layers BEFORE warming Neon so the pull can't
          # sit between the warmup and the container boot. compat-check.sh's
          # own `docker pull` then becomes a cache hit, and the container
          # starts immediately while the compute is still hot. (Without this,
          # the pull re-suspends the Neon branch and the prior-release binary's
          # short pool acquire_timeout dies on the cold-start wakeup.)
          docker pull "ghcr.io/${{ github.repository }}/server:latest"

      - name: Warm Neon compute before compat container boots
        if: steps.deploy_mode.outputs.mode != 'downtime'
        env:
          DATABASE_URL: ${{ steps.create_branch.outputs.db_url }}
        run: |
          # Neon branches autosuspend their compute when idle. Earlier steps
          # (pg_dump + sqlx migrate) woke it, but several seconds may elapse
          # before the compat container starts. The image is already pulled
          # above, so this SELECT is the last step before boot, ensuring
          # compute is hot when the prior-release binary's pool tries to
          # acquire its first connection — its acquire_timeout is much
          # shorter than a cold-start wakeup.
          psql "$DATABASE_URL" -c 'SELECT 1' >/dev/null

      - name: Backward-compat container harness (prev release vs migrated schema)
        if: steps.deploy_mode.outputs.mode != 'downtime'
        id: compat_check
        env:
          DATABASE_URL: ${{ steps.create_branch.outputs.db_url }}
        run: |
          set +e
          bash backend/scripts/compat-check.sh "$DATABASE_URL" "ghcr.io/${{ github.repository }}/server:latest" | tee /tmp/compat-check.log
          RC=${PIPESTATUS[0]}
          set -e
          {
            echo "## Backward-compat container harness"
            echo ""
            STATUS_LINE=$(grep '^COMPAT_STATUS=' /tmp/compat-check.log | tail -1 || true)
            if [ -n "$STATUS_LINE" ]; then
              echo "$STATUS_LINE"
            else
              echo "No COMPAT_STATUS emitted; see raw log below."
            fi
            echo ""
            echo '<details><summary>Raw log</summary>'
            echo ''
            echo '```'
            cat /tmp/compat-check.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      - name: DB-enum coexistence tests
        if: steps.deploy_mode.outputs.mode != 'downtime'
        env:
          DATABASE_URL: ${{ steps.create_branch.outputs.db_url }}
        working-directory: backend
        run: |
          # cargo test takes a single [TESTNAME] filter, so run each ignored
          # coexistence test in its own invocation (two positionals errors out
          # with "unexpected argument"). The second is a cache hit.
          cargo test --lib test_current_reads_previous_release_variants -- --ignored
          cargo test --lib test_current_writes_subset_of_previous_release -- --ignored

      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: release/${{ github.event.release.tag_name }}-migration-check
          api_key: ${{ secrets.NEON_API_KEY }}

  # ============================================
  # Build the static UI once, for the standalone server binaries to embed.
  # The Docker image builds its own copy inside backend/Dockerfile; this job
  # exists because `cross` has no Node toolchain.
  # ============================================
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    needs: test-and-update-fixtures

    steps:
      - uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          git fetch origin ${{ github.event.release.target_commitish }}
          git reset --hard origin/${{ github.event.release.target_commitish }}

      - name: Download generated UI fixtures
        uses: actions/download-artifact@v4
        with:
          name: ui-fixtures
          path: ui/src/lib/data/

      - name: Download generated service logos
        uses: actions/download-artifact@v4
        with:
          name: ui-logos
          path: ui/static/logos/services/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UI
        working-directory: ui
        env:
          PUBLIC_SERVER_HOSTNAME: default
          PUBLIC_SERVER_PORT: 60072
        run: |
          npm ci
          npm run build
          test -f build/index.html || (echo "UI build produced no index.html" && exit 1)

      - name: Upload UI build
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui/build/
          retention-days: 1

  # ============================================
  # Standalone server binaries — migrations and the UI compiled in, so a
  # non-Docker install is one file plus a database.
  # ============================================
  build-server-binaries:
    name: Build Server Binaries
    runs-on: ${{ matrix.runner }}
    needs: [build-ui, migration-branch-test]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            binary: scanopy-server-linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            binary: scanopy-server-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          git fetch origin ${{ github.event.release.target_commitish }}
          git reset --hard origin/${{ github.event.release.target_commitish }}

      # rust-embed resolves `#[folder = "../ui/build"]` at compile time, so the
      # build output has to be in place before cargo runs.
      - name: Download UI build
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui/build/

      # Built in the official Alpine Rust image rather than with `cross`, for
      # two reasons. `cross` mounts the cargo workspace root — `backend/` — so
      # `../ui/build` is not visible inside its container and the rust-embed
      # derive fails. And on Alpine the host target already is musl, so this
      # needs no cross-linking: each runner builds its own architecture
      # natively (matching the runner pair build-docker-server uses) and the
      # result is a statically linked binary.
      - name: Build server (static musl)
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/src -w /src/backend \
            rust:1.90-alpine \
            sh -c 'apk add --no-cache musl-dev build-base perl && cargo build --release --bin server --features embed-ui'

      - name: Prepare binary
        run: |
          # The container writes target/ as root.
          sudo cp backend/target/release/server ${{ matrix.binary }}
          sudo chown "$USER" ${{ matrix.binary }}
          chmod +x ${{ matrix.binary }}
          file ${{ matrix.binary }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 1

  build-binaries:
    name: Build Daemon Binaries
    runs-on: ${{ matrix.os }}
    needs: [test-and-update-fixtures, migration-branch-test]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: scanopy-daemon-linux-amd64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: scanopy-daemon-linux-arm64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: scanopy-daemon-darwin-amd64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: scanopy-daemon-darwin-arm64
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: scanopy-daemon-windows-amd64.exe
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            binary: scanopy-daemon-freebsd-amd64
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Pull latest changes
        shell: bash
        run: |
          git fetch origin ${{ github.event.release.target_commitish }}
          git reset --hard origin/${{ github.event.release.target_commitish }}
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Npcap SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "$env:TEMP\npcap-sdk.zip"
          Expand-Archive -Path "$env:TEMP\npcap-sdk.zip" -DestinationPath "$env:TEMP\npcap-sdk"
          echo "LIB=$env:TEMP\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}
      
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross
      
      - name: Build daemon
        working-directory: backend
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --bin daemon --target ${{ matrix.target }}
          else
            cargo build --release --bin daemon --target ${{ matrix.target }}
          fi
      
      # ---- Windows code signing (thin front-end over the `install` subcommand) ----
      # Signing runs only when the OSSign config secret is provisioned, so releases still succeed
      # (with unsigned binaries) before signing is wired up.
      - name: Check Windows signing availability
        id: signing
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          OSSIGN_CONFIG: ${{ secrets.OSSIGN_CONFIG }}
        run: |
          if [ -n "$OSSIGN_CONFIG" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OSSign signing secret not set — Windows binaries will be built unsigned."
          fi

      - name: Prepare binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp backend/target/${{ matrix.target }}/release/daemon.exe ${{ matrix.binary }}
          else
            cp backend/target/${{ matrix.target }}/release/daemon ${{ matrix.binary }}
            chmod +x ${{ matrix.binary }}
          fi

      - name: Sign daemon exe (standalone binary, OSSign)
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.signing.outputs.enabled == 'true'
        uses: ossign/ossign@7265121e500b3e8c36a60044a5f79684a8224f8e # 1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: ${{ secrets.OSSIGN_CONFIG }}
          inputFile: ${{ matrix.binary }}
          outputFile: ${{ matrix.binary }}
          fileType: pecoff

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 1

      - name: Install cargo-wix
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Stage daemon exe for WiX
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: cp backend/target/${{ matrix.target }}/release/daemon.exe backend/wix/scanopy-daemon.exe

      # Sign the .exe BEFORE it is embedded in the MSI so the binary inside is trusted too.
      - name: Sign daemon exe (WiX-staged, OSSign)
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.signing.outputs.enabled == 'true'
        uses: ossign/ossign@7265121e500b3e8c36a60044a5f79684a8224f8e # 1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: ${{ secrets.OSSIGN_CONFIG }}
          inputFile: backend/wix/scanopy-daemon.exe
          outputFile: backend/wix/scanopy-daemon.exe
          fileType: pecoff

      - name: Build MSI (cargo-wix)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: backend
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          # cargo-wix has no --ext flag; it already links WixUtilExtension
          # (candle+light) and WixUIExtension (light) by default, which is what
          # main.wxs needs (util namespace + WixUI_InstallDir dialog set).
          cargo wix --no-build --nocapture \
            --install-version "$VERSION" \
            --output "../scanopy-daemon-windows-amd64.msi"

      - name: Sign MSI (OSSign)
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.signing.outputs.enabled == 'true'
        uses: ossign/ossign@7265121e500b3e8c36a60044a5f79684a8224f8e # 1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: ${{ secrets.OSSIGN_CONFIG }}
          inputFile: scanopy-daemon-windows-amd64.msi
          outputFile: scanopy-daemon-windows-amd64.msi
          fileType: msi

      - name: Upload MSI artifact
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: scanopy-daemon-windows-amd64.msi
          path: scanopy-daemon-windows-amd64.msi
          retention-days: 1

  # ============================================
  # FreeBSD smoke test - run the cross-built binary on a real FreeBSD host
  # ============================================
  freebsd-smoke-test:
    name: FreeBSD Smoke Test
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
    steps:
      - name: Download FreeBSD binary
        uses: actions/download-artifact@v4
        with:
          name: scanopy-daemon-freebsd-amd64

      - name: Run binary on FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # Confirm the cross-built binary loads and executes on a real FreeBSD host: dynamic
          # linking resolves, syscalls are valid, and the CLI parses. Deeper runtime behaviors
          # (BPF ARP scan, multi-homed local_ip() selection, netdev gateway discovery) require a
          # multi-homed host and are tracked as hardware-validation items in TEST_PLAN.json.
          run: |
            chmod +x scanopy-daemon-freebsd-amd64
            ./scanopy-daemon-freebsd-amd64 --version
            ./scanopy-daemon-freebsd-amd64 --help
            ./scanopy-daemon-freebsd-amd64 install --help

  # ============================================
  # Docker builds - parallelized by image type
  # ============================================
  
  build-docker-server:
    name: Build Server
    runs-on: ${{ matrix.runner }}
    needs: [build-binaries, test-and-update-fixtures, migration-branch-test]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          git fetch origin ${{ github.event.release.target_commitish }}
          git reset --hard origin/${{ github.event.release.target_commitish }}

      - name: Download generated UI fixtures
        uses: actions/download-artifact@v4
        with:
          name: ui-fixtures
          path: ui/src/lib/data/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          labels: |
            org.opencontainers.image.title=Scanopy Server
            org.opencontainers.image.description=Scanopy server — Network diagrams that update themselves.
            org.opencontainers.image.vendor=Scanopy
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            PUBLIC_SERVER_HOSTNAME=default
            PUBLIC_SERVER_PORT=60072
            OCI_IMAGE_TITLE=Scanopy Server
            OCI_IMAGE_DESCRIPTION=Scanopy server — Network diagrams that update themselves.
            OCI_IMAGE_LICENSES=AGPL-3.0-only
          tags: |
            ghcr.io/${{ github.repository }}/server:${{ github.event.release.tag_name }}-${{ matrix.suffix }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.scanopy.deploy_mode=${{ needs.migration-branch-test.outputs.deploy_mode }}
          cache-from: type=gha,scope=server-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.suffix }}

  build-docker-daemon:
    name: Build Daemon Docker
    runs-on: ubuntu-latest
    needs: [build-binaries, migration-branch-test]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          git fetch origin ${{ github.event.release.target_commitish }}
          git reset --hard origin/${{ github.event.release.target_commitish }}
      
      - name: Download Linux amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: scanopy-daemon-linux-amd64
          path: backend/
      
      - name: Download Linux arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: scanopy-daemon-linux-arm64
          path: backend/
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/daemon
          labels: |
            org.opencontainers.image.title=Scanopy Daemon
            org.opencontainers.image.description=Scanopy daemon — network discovery agent.
            org.opencontainers.image.vendor=Scanopy
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.daemon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/daemon:${{ github.event.release.tag_name }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.scanopy.deploy_mode=${{ needs.migration-branch-test.outputs.deploy_mode }}

  # ============================================
  # Create multi-arch manifests for server images
  # ============================================
  
  create-manifests:
    name: Create Multi-arch Manifests
    runs-on: ubuntu-latest
    needs: [build-docker-server, build-docker-daemon]
    permissions:
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create manifest for Server (GHCR)
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}/server:${{ github.event.release.tag_name }} \
            ghcr.io/${{ github.repository }}/server:${{ github.event.release.tag_name }}-amd64 \
            ghcr.io/${{ github.repository }}/server:${{ github.event.release.tag_name }}-arm64

  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [build-binaries, build-server-binaries, create-manifests]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        with:
          # `scanopy-daemon-*/scanopy-daemon-*` already matches the MSI artifact
          # (scanopy-daemon-windows-amd64.msi/scanopy-daemon-windows-amd64.msi). A
          # second `*.msi` glob double-matched it, so softprops uploaded the same
          # asset twice and the second attempt 404'd. One glob covers everything.
          # The server glob is disjoint from the daemon one for the same reason —
          # overlapping globs double-upload.
          files: |
            scanopy-daemon-*/scanopy-daemon-*
            scanopy-server-*/scanopy-server-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  regenerate-db-enum-baseline:
    name: Regenerate DB-enum baseline for next release cycle
    runs-on: ubuntu-latest
    needs: [create-manifests]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Regenerate baseline
        working-directory: backend
        run: cargo test --lib regenerate_db_enum_baseline -- --ignored --nocapture

      - name: Check for fixture changes
        id: diff
        working-directory: backend
        run: |
          if git diff --quiet tests/fixtures/db_enum_baseline.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with refreshed baseline
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        working-directory: backend
        run: |
          BRANCH="chore/regen-db-enum-baseline-${{ github.event.release.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests/fixtures/db_enum_baseline.json
          git commit -m "chore: regenerate db_enum_baseline for ${{ github.event.release.tag_name }}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: regenerate db_enum_baseline for ${{ github.event.release.tag_name }}" \
            --body "Automated baseline refresh after ${{ github.event.release.tag_name }} was published. Merges the new set of DB-backed enum variants into the baseline so the next release cycle's coexistence checks compare against the just-released binary.$'\n\n'Review: confirm the diff matches the enum changes in this release. If a rename shipped with a \`#[serde(alias)]\`, keep the old name in the fixture manually." \
            --base dev \
            --head "$BRANCH"

      - name: Summary
        run: |
          {
            echo "## DB-enum baseline"
            echo ""
            if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
              echo "Baseline changed — PR opened against \`dev\`."
            else
              echo "No baseline changes (no DB-backed enum variants added/removed in this release)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # NDAA Section 889 supply-chain check
  # ============================================
  # Scans the released source tree and every published image for components
  # originating with 889 covered entities. Fails the release on a hit; uploads
  # the SBOMs as release assets on success. See tools/889/889-check.md.
  supply-chain-889:
    name: NDAA Section 889 check
    runs-on: ubuntu-latest
    needs: [create-manifests]
    permissions:
      contents: read
      packages: read
    env:
      SYFT_VERSION: v1.45.1
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          syft version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOMs (source + all released images)
        run: |
          repo="ghcr.io/${{ github.repository }}"
          syft scan dir:. -o cyclonedx-json | jq . > "sbom-source-${TAG}.cdx.json"
          syft scan "registry:${repo}/server:${TAG}" -o cyclonedx-json | jq . > "sbom-server-${TAG}.cdx.json"
          syft scan "registry:${repo}/daemon:${TAG}" -o cyclonedx-json | jq . > "sbom-daemon-${TAG}.cdx.json"

      - name: Run 889 check
        run: ./tools/889/check-889.sh sbom-source-"${TAG}".cdx.json sbom-server-"${TAG}".cdx.json sbom-daemon-"${TAG}".cdx.json

      - name: Summary
        if: always()
        run: |
          {
            echo "## NDAA Section 889 supply-chain check (gate)"
            echo ""
            echo "Scanned the released source tree and the \`server\` and \`daemon\`"
            echo "images at \`${TAG}\`. A hit fails the release."
            echo ""
            echo "Published review evidence lives at \`compliance/ndaa-889/\` and is refreshed"
            echo "by the **889 Evidence** workflow (which tracks the promoted \`:latest\` images)."
          } >> "$GITHUB_STEP_SUMMARY"

