name: 889 Check

# Pull-request gate for the NDAA Section 889 supply-chain check. Generates an
# analyze-only source SBOM with syft and runs tools/889/check-889.sh against it.
# Blocks merge on a hit. Source tree only — images are not built on PRs. No SBOM
# is committed or uploaded. Runs fully offline (no secrets), so it works on
# pull requests from forks.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  SYFT_VERSION: v1.45.1

jobs:
  check:
    name: 889-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"

      - name: Generate source SBOM
        run: syft scan dir:. -o cyclonedx-json | jq . > sbom-source.cdx.json

      - name: Run 889 check
        run: ./tools/889/check-889.sh sbom-source.cdx.json
