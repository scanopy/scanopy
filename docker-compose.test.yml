name: scanopy

services:
  postgres-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      scanopy-dev:
        ipv4_address: 172.25.0.6

  ui-builder:
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    command: sh -c "npm run build && cp -r build/* /output/"
    environment:
      # Node sizes its default old-space heap from the memory it sees, which lands
      # around 2 GB in this compose VM — short of what the SvelteKit production
      # build needs, so it aborts with a V8 OOM. Pin it instead of inheriting.
      - NODE_OPTIONS=--max-old-space-size=3072
    volumes:
      - ./messages:/messages:ro
      - ui-build:/output
    # Wait for the daemon to finish compiling first. The SvelteKit build and a parallel
    # cargo build together exceed the VM's memory, and the loser is whichever the kernel
    # picks — usually rustc, killed with SIGKILL mid-compile. Serialising costs wall time
    # but is the difference between a run that finishes and one that dies at random.
    depends_on:
      daemon:
        condition: service_healthy

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: sh -c "cargo run --bin server --features generate-fixtures"
    ports:
      - "60072:60072"
    environment:
      - RUST_LOG=debug,sqlx=off,tower_http=off
      - SCANOPY_PUBLIC_URL=http://localhost:60072
      - SCANOPY_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres-dev:5432/scanopy
      - SCANOPY_WEB_EXTERNAL_PATH=/app/static
      - SCANOPY_LOG_LEVEL=debug
      - SCANOPY_INTEGRATED_DAEMON_URL=http://daemon:60073
      - SCANOPY_ENFORCE_BILLING_FOR_TESTING=true
    volumes:
      - ./backend:/app
      - data-volume:/data
      - ui-build:/app/static:ro
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - rust-target:/app/target
    depends_on:
      ui-builder:
        condition: service_completed_successfully
      postgres-dev:
        condition: service_healthy
      daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:60072/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Cold runs compile the whole crate inside the container; 600s was not enough and
      # the container got marked unhealthy mid-build, failing `up --wait`.
      start_period: 1800s
    networks:
      scanopy-dev:
        ipv4_address: 172.25.0.3

  daemon:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    privileged: true
    restart: unless-stopped
    environment:
      - SCANOPY_SERVER_URL=http://server:60072
      - SCANOPY_DAEMON_PORT=60073
      - SCANOPY_BIND_ADDRESS=0.0.0.0
      - SCANOPY_NAME=scanopy-daemon
      - SCANOPY_MODE=daemon_poll
      - SCANOPY_LOG_LEVEL=debug
      - SCANOPY_HEARTBEAT_INTERVAL=30
    volumes:
      - ./backend:/app
      - ./data/daemon_config:/root/.config/scanopy/daemon
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - rust-target:/app/target
    command: sh -c "cargo run --bin daemon --features generate-fixtures"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60073/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      # Cold runs compile the whole crate inside the container; 600s was not enough and
      # the container got marked unhealthy mid-build, failing `up --wait`.
      start_period: 1800s
    networks:
      scanopy-dev:
        ipv4_address: 172.25.0.4

  daemon-serverpoll:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    privileged: true
    restart: unless-stopped
    environment:
      - SCANOPY_SERVER_URL=http://server:60072
      - SCANOPY_MODE=server_poll
      - SCANOPY_DAEMON_PORT=60074
      - SCANOPY_BIND_ADDRESS=0.0.0.0
      - SCANOPY_NAME=scanopy-daemon-serverpoll
      - SCANOPY_LOG_LEVEL=debug
    volumes:
      - ./backend:/app
      - ./data/daemon_serverpoll_config:/root/.config/scanopy/daemon
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - rust-target:/app/target
    command: sh -c "cargo run --bin daemon --features generate-fixtures"
    # Wait for daemon to be healthy first - they share the same cargo target
    # directory, so compiling sequentially avoids lock contention
    depends_on:
      daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60074/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      # Cold runs compile the whole crate inside the container; 600s was not enough and
      # the container got marked unhealthy mid-build, failing `up --wait`.
      start_period: 1800s
    ports:
      - "60074:60074"
    networks:
      scanopy-dev:
        ipv4_address: 172.25.0.7

  homeassistant:
    # Pinned rather than `latest`: this is a discovery fixture, and upstream rebuilds it daily.
    # The 2026-09-16 build's first boot outlasted an entire 18-minute release run, so the scan
    # probed a port nothing was listening on and v0.17.16's release test failed looking like a
    # discovery bug. Move this deliberately, not by whenever CI last pulled.
    image: lscr.io/linuxserver/homeassistant:2026.9.2-ls247
    container_name: homeassistant-discovery
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - homeassistant-config:/config
    ports:
      - 8123:8123
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8123 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      # First boot on a fresh config volume rewrites permissions across every bundled python
      # package before the HTTP listener comes up, which CI pays on every run because its volume
      # is always new. 60s was tried in docker-compose.dev.yml (fa6953e50) and reverted an hour
      # later (0d1e221f3) for being far too short.
      start_period: 600s
    networks:
      scanopy-dev:
        ipv4_address: 172.25.0.5

volumes:
  ui-build:
  cargo-cache:
  cargo-git:
  rust-target:
  data-volume:
  daemon-config-volume:
  postgres_data:
  homeassistant-config:

networks:
  scanopy-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/28
          gateway: 172.25.0.1