name: scanopy

services:
  daemon:
    image: ghcr.io/scanopy/scanopy/daemon:latest
    container_name: scanopy-daemon
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_SERVER_URL: http://127.0.0.1:60072
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60073/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - daemon-config:/root/.config/scanopy/daemon
      # Comment out the line below to disable docker discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      # To read the password from a secret file (see the secrets block at the bottom),
      # replace POSTGRES_PASSWORD above with:
      # POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # secrets:
    #   - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - scanopy

  server:
    image: ghcr.io/scanopy/scanopy/server:latest
    ports:
      - "60072:60072"
    # Pass a .env alongside this file straight through to the server. Compose otherwise
    # reads .env only to interpolate ${...} here, so settings that have no line below --
    # every SCANOPY_SMTP_* variable among them -- would never reach the container.
    # Optional: `docker compose up` works with no .env present.
    env_file:
      - path: .env
        required: false
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_PUBLIC_URL: ${SCANOPY_PUBLIC_URL:-http://localhost:60072}
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
      # Any SCANOPY_<NAME> can instead be read from a file with SCANOPY_<NAME>_FILE. Set one or
      # the other, never both. The database URL embeds the Postgres password, so with secrets,
      # replace SCANOPY_DATABASE_URL above with:
      # SCANOPY_DATABASE_URL_FILE: /run/secrets/database_url
    # secrets:
    #   - database_url
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      daemon:
        condition: service_started
    restart: unless-stopped
    networks:
      - scanopy

volumes:
  postgres_data:
  daemon-config:

# Secret files for the commented-out *_FILE settings above. Each file holds only the value.
# database_url holds the full URL, e.g. postgresql://postgres:<password>@postgres:5432/scanopy
# secrets:
#   postgres_password:
#     file: ./secrets/postgres_password
#   database_url:
#     file: ./secrets/database_url

networks:
  scanopy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
          gateway: 172.31.0.1
